<IfModule ssl_module>
<VirtualHost *:443>
	ServerName example.test
	ServerAlias www.example.test *.example.test
	DocumentRoot /var/www/example/public
	SSLEngine on
	SSLCertificateFile /etc/ssl/certs/example.pem

	Alias /static /srv/assets
	<Directory /srv/assets>
		Require all granted
		Options -Indexes
	</Directory>

	<Directory /var/www/example/public>
		AllowOverride All
		Options -Indexes
	</Directory>
	<Directory /var/www/example/public/private>
		Require all denied
	</Directory>
	<Directory /var/www/example/public/uploads>
		php_admin_flag engine off
	</Directory>

	ProxyPreserveHost On
	ProxyPass /api/health !
	ProxyPass /api/ http://127.0.0.1:9000/api/
	ProxyPassReverse /api/ http://127.0.0.1:9000/api/
	<FilesMatch "\.php$">
		SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
	</FilesMatch>

	RewriteEngine On
	RewriteRule ^/legacy/(.*)$ /blog/$1 [R=301,L]
	RewriteRule ^/feed$ /index.php?feed=rss [PT,L]
	RewriteRule ^/ws/(.*)$ ws://127.0.0.1:8081/$1 [P]
	RewriteCond %{HTTPS} off
	RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

	Redirect 301 /old-page /new-page
	SetEnv APP_ENV staging
	ErrorDocument 404 /404.php
	Header set X-Site example

</VirtualHost>
</IfModule>
