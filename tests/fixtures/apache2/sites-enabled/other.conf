<VirtualHost *:80>
	ServerName other.test
	DocumentRoot "/var/www/other"
	DirectoryIndex index.html
	<Directory "/var/www/other">
		Options +Indexes
		AllowOverride FileInfo
	</Directory>

	<Proxy balancer://cluster>
		BalancerMember http://10.0.0.1:8080
		BalancerMember http://10.0.0.2:8080
	</Proxy>
	ProxyPass /app balancer://cluster/app
	<Location /legacy-api>
		ProxyPass http://legacy.internal:8000/v1
	</Location>

	RewriteEngine on
	RewriteMap lc int:tolower
	RewriteMap shortlinks txt:/etc/apache2/redirects.txt
	RewriteCond ${shortlinks:$1} !=""
	RewriteRule ^/go/(.*)$ ${shortlinks:$1} [R=302,L]
	RewriteRule ^/UPPER/(.*)$ /lower/${lc:$1} [R,L]

	ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
	RedirectMatch 410 ^/removed/
	<Location /server-status>
		SetHandler server-status
		Require local
	</Location>
</VirtualHost>
